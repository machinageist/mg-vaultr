[workspace]
members = [
    "crates/mg-vault-core",
    "crates/mg-vault-index",
    "crates/mg-vault-client",
    "crates/mg-vault-service",
    "crates/mg-vault-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs", "net", "process"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
yaml-edit = { version = "0.2.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
